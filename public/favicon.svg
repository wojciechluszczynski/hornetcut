<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" fill="#0B0C0E"/>
  <!-- cutting circle with a gap: the cut path around a manhole -->
  <circle cx="32" cy="32" r="21" fill="none" stroke="#FFB800" stroke-width="7"
          stroke-dasharray="105 27" transform="rotate(-118 32 32)"/>
  <!-- cutter head on the circle -->
  <rect x="45" y="14" width="11" height="11" fill="#FFB800" transform="rotate(35 50.5 19.5)"/>
  <!-- manhole -->
  <circle cx="32" cy="32" r="8" fill="none" stroke="#E8E6E1" stroke-width="3"/>
</svg>
