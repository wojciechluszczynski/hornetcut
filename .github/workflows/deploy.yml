name: Deploy to Hostinger (FTP)

# Builds the static site and deploys dist/ over plain FTP with lftp.
# Prints the FTP working directory and listings so we can see exactly where
# files land (the panel's FTPS endpoint was misrouting).
# Secrets: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Install lftp
        run: sudo apt-get update -q && sudo apt-get install -y -q lftp

      - name: Diagnose + deploy over FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -c "
          set ftp:ssl-allow false;
          set net:max-retries 2;
          set net:timeout 20;
          open -u '$FTP_USERNAME','$FTP_PASSWORD' 'ftp://$FTP_SERVER';
          echo '=== pwd (FTP home) ===';
          pwd;
          echo '=== ls home ===';
          cls -l;
          echo '=== ls public_html ===';
          cls -l public_html || echo '(no public_html here)';
          echo '=== mirror dist -> public_html ===';
          mirror -R --delete --parallel=4 --verbose=1 dist/ public_html/;
          echo '=== after: ls public_html ===';
          cls -l public_html;
          "
