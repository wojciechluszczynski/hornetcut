name: FTP probe

# Diagnostic only: uploads one small marker file over FTP and lists the target
# directory. No deletions, no site content touched. Used to check whether the
# FTP endpoint reaches the filesystem that actually serves hornetcut.pl.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Install lftp
        run: sudo apt-get update -q && sudo apt-get install -y -q lftp

      - name: Upload marker and list docroot
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          echo "ftp-probe-$GITHUB_RUN_ID" > _ftp-probe.txt
          lftp -c "
          set ftp:ssl-allow false;
          set net:max-retries 2;
          set net:timeout 20;
          open -u '$FTP_USERNAME','$FTP_PASSWORD' 'ftp://$FTP_SERVER';
          echo '=== katalog domowy ===';
          cls -l;
          echo '=== czy widac nasza zywa strone w public_html ===';
          cls -l public_html | head -20;
          echo '=== wgrywam marker ===';
          put -O public_html _ftp-probe.txt;
          echo '=== po wgraniu ===';
          cls -l public_html/_ftp-probe.txt;
          "
